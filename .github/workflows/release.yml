name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish (e.g. v0.8.0)'
        required: true
        type: string

# The publish step creates/updates the GitHub release, so it needs write access.
permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.50.1'

jobs:
  quality:
    name: Analyze · format · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter analyze
      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver
      - name: Unit & widget tests
        run: flutter test

  build-android:
    name: Build signed APKs
    runs-on: ubuntu-latest
    needs: quality
    env:
      HAS_SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - run: flutter pub get
      - run: dart run build_runner build

      - name: Restore upload keystore
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          mkdir -p android/keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/keystore/upload-keystore.p12
          {
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "storeFile=../keystore/upload-keystore.p12"
          } > android/key.properties

      - name: Build universal + per-ABI APKs
        if: env.HAS_SIGNING_KEY == 'true'
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi

      - name: Verify signatures and stage assets
        if: env.HAS_SIGNING_KEY == 'true'
        run: |
          set -euo pipefail
          version="$(python3 -c "import re; print(re.search(r'^version: ([0-9.]+)', open('pubspec.yaml').read(), re.M).group(1))")"
          build_number="$(python3 -c "import re; print(re.search(r'^version: [0-9.]+\+(\d+)', open('pubspec.yaml').read(), re.M).group(1))")"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/nowpill-$version-universal.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/nowpill-$version-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/nowpill-$version-armeabi-v7a.apk"
          for apk in dist/*.apk; do
            "$build_tools/apksigner" verify "$apk"
            certs="$("$build_tools/apksigner" verify --print-certs "$apk" 2>/dev/null)"
            grep -q 'CN=NowPill' <<<"$certs"
            badging="$("$build_tools/aapt2" dump badging "$apk" 2>/dev/null | sed -n '1p')"
            echo "$apk: $badging"
            # Flutter adds 1000/2000/4000 to the base versionCode for split ABIs.
            base_code=$((10#$build_number))
            code_ok=0
            for code in "$base_code" "$((base_code + 1000))" "$((base_code + 2000))" "$((base_code + 4000))"; do
              if grep -q "versionCode='$code'" <<<"$badging"; then code_ok=1; break; fi
            done
            if [[ "$code_ok" -ne 1 ]]; then
              echo "Unexpected versionCode in $apk: $badging" >&2
              exit 1
            fi
            echo "$badging" | grep -q "versionName='$version'"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS-android)

      - name: Upload signed APKs
        if: env.HAS_SIGNING_KEY == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: nowpill-apk
          path: dist/*
          if-no-files-found: error

      - name: Warn about missing signing secrets
        if: env.HAS_SIGNING_KEY != 'true'
        run: |
          echo "::warning::ANDROID_KEYSTORE_BASE64 is not set — skipping APK build. Add the signing secrets to publish APKs from CI; attach locally built APKs to the release instead." | tee -a "$GITHUB_STEP_SUMMARY"

  build-linux:
    name: Build Linux x86-64 tarball
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux desktop build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - run: flutter pub get
      - run: dart run build_runner build
      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop
      - name: Build Linux (release)
        run: flutter build linux --release

      - name: Package bundle
        run: |
          set -euo pipefail
          version="$(python3 -c "import re; print(re.search(r'^version: ([0-9.]+)', open('pubspec.yaml').read(), re.M).group(1))")"
          stage="$(mktemp -d)"
          mkdir -p "$stage/nowpill-$version-linux-x64"
          cp -a build/linux/x64/release/bundle/. "$stage/nowpill-$version-linux-x64/"
          mkdir -p dist
          tar -czf "dist/nowpill-$version-linux-x64.tar.gz" -C "$stage" "nowpill-$version-linux-x64"
          (cd dist && sha256sum *.tar.gz > SHA256SUMS-linux)
          rm -rf "$stage"

      - uses: actions/upload-artifact@v7
        with:
          name: nowpill-linux
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release assets
    runs-on: ubuntu-latest
    needs: [quality, build-android, build-linux]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          pattern: nowpill-*
          merge-multiple: true
          path: dist

      - name: Create release if missing, then upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --notes-from-tag --title "$TAG"
          fi
          cat dist/SHA256SUMS-* > dist/SHA256SUMS
          rm dist/SHA256SUMS-*
          gh release upload "$TAG" dist/* --clobber
